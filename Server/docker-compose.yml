services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: where_is_my_bus
      MYSQL_USER: busapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - busdb:/var/lib/mysql
      - ./database/001_CreateDatabase.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./database/002_CreateTables.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./database/003_CreateIndexes.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ./database/004_SeedData.sql:/docker-entrypoint-initdb.d/004.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Server=mysql;Port=3306;Database=where_is_my_bus;User ID=busapp;Password=${MYSQL_PASSWORD};DateTimeKind=Utc;ConnectionTimeout=5;"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  busdb:
